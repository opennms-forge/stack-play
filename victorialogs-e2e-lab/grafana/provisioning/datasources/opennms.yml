apiVersion: 1

datasources:
  - name: OpenNMS flow
    type: opennms-flow-datasource
    access: proxy
    url: http://opennms:8980/opennms
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin
    isDefault: true
  - name: OpenNMS performance
    type: opennms-performance-datasource
    access: proxy
    url: http://opennms:8980/opennms
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin
  - name: OpenNMS entity
    type: opennms-entity-datasource
    access: proxy
    url: http://opennms:8980/opennms
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    # Fixed uid: the flow-ops dashboard's ${datasource} variable and its drill-down
    # links resolve to this — never let Grafana auto-generate it.
    uid: victorialogs
    access: proxy
    url: http://victorialogs:9428
